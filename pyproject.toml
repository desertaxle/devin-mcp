[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-mcp"
version = "0.1.0"
description = "MCP server for delegating tasks to Devin AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp[tasks]>=3",
    "httpx>=0.28.0",
    "mule-lib>=0.1.0",
]

[project.scripts]
devin-mcp = "main:main"

[dependency-groups]
dev = [
    "prek>=0.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python = ".venv"

# FastMCP v3's @mcp.tool() decorator is typed as returning FunctionTool,
# but at runtime returns the original function. Suppress the false positive.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"

[tool.pytest.ini_options]
addopts = "--cov=main --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
